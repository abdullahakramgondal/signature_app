services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - JWT_SECRET=change-this-to-a-long-random-string
    volumes:
      - jobdata:/data
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m worker.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
    volumes:
      - jobdata:/data
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  jobdata: