services:
  redis:
    image: redis:7
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - ROOT_PATH=/api
      - MODEL_BUCKET=signature-app-models-abdullah-295392292084-ap-southeast-2-an
      - AWS_REGION=ap-southeast-2
    volumes:
      - jobdata:/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m worker.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - MODEL_BUCKET=signature-app-models-abdullah-295392292084-ap-southeast-2-an
      - AWS_REGION=ap-southeast-2
    volumes:
      - jobdata:/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  jobdata: